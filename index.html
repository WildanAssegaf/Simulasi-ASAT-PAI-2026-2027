<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAIlab – Latihan Soal PAI SMP</title>
<meta name="theme-color" content="#1e4fd6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Patrick+Hand&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe2;--paper:#fffef8;--ink:#1b2a41;--mu:#5b6678;--ln:#d5e4f6;--mg:#f1a5a5;
  --b:#1e4fd6;--bt:#fff;--bd:#163aa3;--hl:#fff176;--hlt:#4a3f00;
  --ok:#14804a;--okbg:#dcf5e5;--no:#c0313b;--nobg:#fde4e4;--sel:#e8efff;
  --card:#ffffff;--bar:#e3e9f4;--shadow:0 6px 18px -10px rgba(27,42,65,.35);
  --nav:#1e4fd6;--navt:#e8efff;--wood:#d9c29a;
  --head:'Patrick Hand','Nunito',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#101a17;--paper:#1c2b27;--ink:#eef3e9;--mu:#a7bbb2;--ln:rgba(255,255,255,.07);--mg:rgba(245,215,110,.4);
  --b:#f5d76e;--bt:#1a2723;--bd:#c9a93f;--hl:#f5d76e;--hlt:#1a2723;
  --ok:#7fdca4;--okbg:rgba(127,220,164,.14);--no:#ff9696;--nobg:rgba(255,150,150,.13);--sel:rgba(245,215,110,.12);
  --card:#22332e;--bar:#33463f;--shadow:0 8px 20px -10px rgba(0,0,0,.7);
  --nav:#0b1311;--navt:#c9d8d1;--wood:#6e4f2e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:600 17px/1.6 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%;transition:background .25s,color .25s}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.5rem;margin:26px 0 10px}h3{font-size:1.2rem}
.mu{color:var(--mu);font-weight:600;font-size:.92rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px;box-shadow:0 0 0 5px var(--b)}

/* navbar */
#sb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px max(14px,calc(50% - 450px));padding-top:max(10px,env(safe-area-inset-top));background:var(--nav);color:var(--navt);box-shadow:0 4px 0 rgba(0,0,0,.18);overflow-x:auto;scrollbar-width:none}
#sb::-webkit-scrollbar{display:none}
.lg{display:flex;align-items:center;gap:7px;margin-right:auto;font:400 1.5rem var(--head);color:#fff;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
:root[data-theme=dark] .lg{color:var(--b)}
.lg i{font-style:normal;color:var(--hl)}
.lg svg{width:28px;height:28px;flex:none}
.tab{background:none;border:0;cursor:pointer;padding:8px 13px;border-radius:99px;font-weight:800;font-size:.9rem;color:var(--navt);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.14)}
.tab.on{background:var(--hl);color:var(--hlt)}
.tg{background:rgba(255,255,255,.14);border:0;cursor:pointer;width:40px;height:40px;border-radius:50%;font-size:1.15rem;flex:none}
.tg:hover{background:rgba(255,255,255,.26)}

main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
:root[data-theme=dark] .card{border-color:rgba(255,255,255,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.btn{border:0;cursor:pointer;background:var(--b);color:var(--bt);font-weight:800;padding:12px 22px;border-radius:14px;box-shadow:0 4px 0 var(--bd);transition:transform .12s,box-shadow .12s;text-align:center}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn.s{background:var(--card);color:var(--ink);border:2px solid var(--ln);box-shadow:0 4px 0 var(--ln)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;cursor:pointer;color:var(--b);font-weight:800;padding:6px 0;font-size:.95rem}
:root[data-theme=light] .link{color:var(--b)}

/* hero = papan nama / papan tulis */
.hero{position:relative;border-radius:22px;padding:22px 22px 20px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,#1e4fd6,#2f6bff 70%,#4b86ff);box-shadow:var(--shadow);overflow:hidden}
.hero::after{content:"🕌";position:absolute;right:14px;bottom:-14px;font-size:5.5rem;opacity:.18}
:root[data-theme=dark] .hero{background:#1f3b33;border:8px solid var(--wood);border-radius:18px;box-shadow:inset 0 0 40px rgba(0,0,0,.4),var(--shadow);padding:16px 18px}
.hero h1{color:#fff}:root[data-theme=dark] .hero h1{color:#f6f1d8}
.hero p{margin:4px 0 12px;opacity:.92}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:99px;font-weight:800;font-size:.88rem}
.xpb{height:12px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden;margin:12px 0 4px}.xpb i{display:block;height:100%;background:var(--hl);border-radius:9px;transition:width .5s}

/* bab grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bab{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;background:var(--card);border:2px solid var(--ln);border-left:10px solid var(--c);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
:root[data-theme=dark] .bab{border-color:rgba(255,255,255,.1);border-left-color:var(--c)}
.bab:hover{transform:translateY(-3px) rotate(-.3deg)}
.bab:focus-visible{outline:3px solid var(--hl);box-shadow:0 0 0 5px var(--b)}
.bab .no{font:400 1rem var(--head);color:var(--mu);letter-spacing:.5px}
.bab .ic{position:absolute;right:14px;top:10px;font-size:1.7rem}
.bab .bt{display:block;font:400 1.3rem/1.2 var(--head);margin:2px 36px 4px 0}
.bab .no{display:block}
.bab h3{margin:2px 34px 4px 0}
.bar{height:9px;background:var(--bar);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}

/* bab detail */
.back{margin-bottom:6px}
.bh{border-left:10px solid var(--c);border-radius:18px;padding-left:16px}
details{background:var(--card);border:2px solid var(--ln);border-radius:14px;margin:8px 0;padding:2px 14px}
:root[data-theme=dark] details{border-color:rgba(255,255,255,.1)}
summary{cursor:pointer;font-weight:800;padding:10px 0;list-style-position:inside}
details[open] summary{color:var(--b)}
details div.bd{padding:0 0 12px;font-size:.98rem}
.ar{display:block;direction:rtl;text-align:center;font:400 1.7rem/2.2 Amiri,serif;margin:6px 0;color:var(--ink)}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mode .btn small{display:block;font-weight:600;opacity:.85}

/* kertas buku tulis */
.sheet{position:relative;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--ln) 31px 32px);background-position:0 12px;border:2px solid var(--ln);border-radius:18px;padding:18px 18px 18px 44px;box-shadow:var(--shadow);margin-bottom:14px}
.sheet::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--mg)}
:root[data-theme=dark] .sheet{border-color:rgba(255,255,255,.12)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:800;background:var(--hl);color:var(--hlt)}
.q{font-family:var(--head);font-size:1.4rem;line-height:32px;margin:8px 0 14px}
.sa{display:grid;gap:8px;margin:6px 0 12px}
.sa .bx{background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:8px 14px;line-height:1.5}
:root[data-theme=dark] .sa .bx{border-color:rgba(255,255,255,.12)}
.sa b.l{font-family:var(--head);font-weight:400;color:var(--b);letter-spacing:.5px}
.sa .sb2{text-align:center;font:400 1.1rem var(--head);letter-spacing:3px;color:var(--mu)}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;cursor:pointer;border:2px solid var(--ln);background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:9px;font-weight:700;line-height:1.45;transition:border-color .15s,transform .15s}
:root[data-theme=dark] .opt{border-color:rgba(255,255,255,.14)}
.opt:hover{border-color:var(--b);transform:translateX(3px)}
.opt:focus-visible{outline:3px solid var(--hl);box-shadow:0 0 0 5px var(--b)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sel);font:400 1rem var(--head);color:var(--b);border:2px solid var(--b)}
.opt.pk .k{border-radius:8px}
.opt.sel{background:var(--sel);border-color:var(--b)}.opt.sel .k{background:var(--b);color:var(--bt)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt[aria-disabled=true]{cursor:default;transform:none}
.fb{border-radius:14px;padding:12px 16px;margin:10px 0;line-height:1.55;font-weight:600}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.no{background:var(--nobg);border:2px solid var(--no)}
.fb b{font-family:var(--head);font-weight:400;font-size:1.2rem}
.hint{font-size:.88rem;color:var(--mu);margin:-4px 0 10px;font-weight:700}

/* hasil */
.score{font:400 4rem var(--head);line-height:1;text-align:center;color:var(--b)}
.stars{text-align:center;font-size:2rem;letter-spacing:6px;margin:4px 0 8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat div{background:var(--sel);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:400 1.6rem var(--head);color:var(--b)}
.pill{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:99px;border:2px solid var(--ln);background:var(--card);font-weight:800;font-size:.9rem;margin:0 6px 8px 0;display:inline-block}
:root[data-theme=dark] .pill{border-color:rgba(255,255,255,.18)}
.pill.on{background:var(--b);color:var(--bt);border-color:var(--b)}
.pill:focus-visible{outline:3px solid var(--hl);box-shadow:0 0 0 5px var(--b)}
.inp{width:100%;max-width:320px;padding:12px 16px;border-radius:14px;border:2px solid var(--ln);background:var(--paper);color:var(--ink);font:700 1rem Nunito,sans-serif;margin:6px 0 10px;display:block}
.inp:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 4px var(--sel)}
label.lb{display:block;font-weight:800;font-size:.9rem;color:var(--mu);margin-top:8px}
footer{max-width:900px;margin:0 auto;padding:10px 16px 40px;text-align:center;font-size:.8rem;color:var(--mu)}
@media(max-width:520px){
  .tab{padding:8px 9px;font-size:.85rem}#sb{gap:2px}.lg{font-size:1.3rem}.lg svg{width:24px;height:24px}
  body{font-size:16px}h1{font-size:1.7rem}
  .sheet{padding:14px 12px 14px 38px}.sheet::before{left:26px}
  .q{font-size:1.22rem}.hero{padding:18px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
.sheet,.card,.hero{animation:pop .3s ease both}
</style>
</head>
<body>
<nav id="sb" aria-label="Menu utama"></nav>
<main id="app"></main>
<footer>PAIlab · Latihan soal Pendidikan Agama Islam dan Budi Pekerti SMP</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== DATA SOAL PAIlab ===== */
const pg=(q,o,e)=>({t:'pg',q,o,e});            // o[0] = jawaban benar
const pk=(q,o,a,e)=>({t:'pk',q,o,a,e});        // a = indeks jawaban benar
const sa=(p,r,k,e)=>({t:'sa',p,r,k,e});        // k = 0..4 (lihat SAO)
const SAO=[
 "Pernyataan benar, alasan benar, dan keduanya menunjukkan hubungan sebab akibat",
 "Pernyataan benar, alasan benar, tetapi keduanya tidak menunjukkan hubungan sebab akibat",
 "Pernyataan benar, alasan salah",
 "Pernyataan salah, alasan benar",
 "Pernyataan dan alasan keduanya salah"
];
const TJ={pg:'Pilihan Ganda',pk:'Pilihan Ganda Kompleks',sa:'Sebab-Akibat'};

const BAB=[
/* ---------- BAB 1 ---------- */
{n:"Al-Qur’an Menginspirasi",t:"Semangat Menuntut Ilmu",ic:"📖",c:"#e8590c",
sub:[
["QS Al-Mujadilah/58:11",`<span class=ar>يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ</span>Allah mengangkat derajat orang yang beriman dan orang yang diberi ilmu pengetahuan. Awal ayat ini memerintahkan kita melapangkan tempat dalam majelis (<i>tafassahu fil majalis</i>) agar semua orang dapat duduk dan belajar dengan nyaman.`],
["QS Az-Zumar/39:9",`<span class=ar>قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ</span>Orang yang berilmu tidak sama dengan orang yang tidak berilmu. Hanya <i>ulul albab</i> (orang yang menggunakan akal dan hatinya) yang dapat mengambil pelajaran.`],
["Hadis tentang menuntut ilmu",`<span class=ar>طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ</span>“Menuntut ilmu itu wajib bagi setiap muslim.” (HR. Ibnu Majah). Hadis lain: orang yang menempuh jalan untuk mencari ilmu akan dimudahkan Allah jalannya menuju surga (HR. Muslim).`],
["Keutamaan ilmu dan orang berilmu",`Derajat orang berilmu ditinggikan, jalan menuju surga dimudahkan, dan ilmu yang bermanfaat menjadi amal jariyah. Adab penuntut ilmu: ikhlas, sungguh-sungguh, sabar, menghormati guru, dan mengamalkan ilmunya.`]
],
q:[
pg("Ayat yang menyatakan bahwa Allah akan mengangkat derajat orang beriman dan berilmu adalah...",["QS Al-Mujadilah/58:11","QS Al-Ikhlas/112:1","QS Al-Kautsar/108:1","QS Al-Ma’un/107:1"],"Allah mengangkat derajat orang beriman dan berilmu dinyatakan dalam QS Al-Mujadilah/58:11."),
pg("Pesan pokok QS Az-Zumar/39:9 adalah...",["orang yang berilmu tidak sama dengan orang yang tidak berilmu","semua orang pasti memiliki ilmu yang sama","ilmu hanya dimiliki oleh orang kaya","belajar tidak perlu dilakukan sepanjang hidup"],"Ayat ini menegaskan perbedaan kedudukan antara orang yang mengetahui dan yang tidak mengetahui."),
pg("Hadis “Thalabul ‘ilmi faridhatun ‘ala kulli muslim” artinya...",["menuntut ilmu wajib bagi setiap muslim","menuntut ilmu sunah bagi sebagian muslim","menuntut ilmu wajib bagi laki-laki saja","menuntut ilmu hanya boleh saat muda"],"Kata faridhah berarti kewajiban, dan berlaku untuk setiap muslim, laki-laki maupun perempuan."),
pg("Perintah “tafassahu fil majalis” pada QS Al-Mujadilah/58:11 bermakna...",["lapangkanlah tempat dalam majelis","diamlah selama majelis berlangsung","tinggalkan majelis jika sudah selesai","pilihlah teman duduk yang kaya"],"Tafassahu artinya berilah kelonggaran. Contohnya menggeser tempat duduk agar teman dapat duduk."),
pg("Orang yang menggunakan akal dan hatinya untuk mengambil pelajaran disebut...",["ulul albab","munafik","mustahik","wakif"],"Ulul albab adalah orang-orang yang berakal yang dapat mengambil pelajaran (QS Az-Zumar/39:9)."),
pg("Sikap penuntut ilmu yang benar adalah...",["ikhlas, sungguh-sungguh, dan menghormati guru","belajar agar dipuji teman","belajar hanya menjelang ujian","menyontek jika soal sulit"],"Adab menuntut ilmu meliputi niat ikhlas, kesungguhan, dan penghormatan kepada guru."),
pg("Ilmu yang bermanfaat dan terus memberi kebaikan setelah pemiliknya wafat termasuk...",["amal jariyah","zakat fitrah","kafarat","hadiah dunia"],"Ilmu yang bermanfaat adalah salah satu amal yang pahalanya terus mengalir."),
pg("Perintah pertama dalam wahyu pertama (QS Al-‘Alaq/96:1) yang berkaitan dengan ilmu adalah...",["iqra’ (bacalah)","uktub (tulislah)","isma’ (dengarkanlah)","ihfazh (hafalkanlah)"],"Wahyu pertama diawali “Iqra’”, yang menunjukkan pentingnya membaca dan belajar."),
pk("Pilih semua perilaku yang mencerminkan semangat menuntut ilmu.",["Rajin membaca buku","Bertanya kepada guru saat belum paham","Mengulang pelajaran di rumah","Menunda mengerjakan tugas","Mencontek pekerjaan teman"],[0,1,2],"Rajin membaca, bertanya, dan mengulang pelajaran adalah ciri semangat menuntut ilmu."),
pk("Pilih semua pernyataan yang benar tentang QS Az-Zumar/39:9.",["Orang berilmu tidak sama dengan orang yang tidak berilmu","Yang dapat mengambil pelajaran adalah ulul albab","Derajat semua manusia sama tanpa memandang ilmu","Ilmu hanya bermanfaat untuk urusan dunia"],[0,1],"Ayat ini membedakan orang berilmu dan tidak berilmu, dan menyebut ulul albab sebagai yang mengambil pelajaran."),
pk("Pilih semua keutamaan orang yang berilmu.",["Derajatnya ditinggikan Allah","Dimudahkan jalannya menuju surga","Ilmunya dapat menjadi amal jariyah","Otomatis masuk surga tanpa beramal","Tidak perlu beribadah lagi"],[0,1,2],"Ilmu tidak menggugurkan kewajiban ibadah dan amal."),
pk("Pilih semua contoh pengamalan QS Al-Mujadilah/58:11 di kelas.",["Menggeser tempat duduk agar teman dapat duduk","Mempersilakan teman yang baru datang duduk","Menahan bangku kosong agar tidak dipakai teman","Memilih duduk hanya dengan teman dekat"],[0,1],"Melapangkan majelis berarti memberi ruang bagi orang lain untuk belajar."),
sa("Orang berilmu memiliki derajat yang tinggi di sisi Allah.","Allah mengangkat derajat orang beriman dan orang yang diberi ilmu (QS Al-Mujadilah/58:11).",0,"Ayat tersebut menjadi alasan yang menjelaskan pernyataan, sehingga keduanya berhubungan sebab akibat."),
sa("Menuntut ilmu hukumnya wajib bagi setiap muslim.","Ilmu hanya diperlukan untuk mencari pekerjaan.",2,"Pernyataan benar (HR. Ibnu Majah). Alasan salah, karena ilmu juga untuk beribadah, berakhlak, dan bermanfaat bagi sesama."),
sa("Penuntut ilmu harus menghormati gurunya.","Guru adalah pembimbing yang menjadi perantara sampainya ilmu kepada murid.",0,"Karena guru menjadi perantara ilmu, murid wajib menghormatinya."),
sa("Orang berilmu sama kedudukannya dengan orang yang tidak berilmu.","Ilmu tidak membawa perbedaan apa pun bagi manusia.",4,"Keduanya salah. QS Az-Zumar/39:9 menegaskan keduanya tidak sama.")
]},

/* ---------- BAB 2 ---------- */
{n:"Meyakini Hari Akhir",t:"dengan Mawas Diri",ic:"⏳",c:"#7048e8",
sub:[
["Iman kepada hari akhir","Beriman kepada hari akhir adalah rukun iman yang kelima. Artinya meyakini bahwa kehidupan dunia akan berakhir dan setiap manusia akan dibangkitkan, dihisab, lalu mendapat balasan atas amalnya. Hari akhir pasti terjadi, tetapi waktunya hanya Allah yang mengetahui."],
["Kiamat sugra dan kubra","<b>Kiamat sugra</b> (kecil): kehancuran yang bersifat sebagian atau khusus, misalnya kematian dan bencana alam. <b>Kiamat kubra</b> (besar): kehancuran total alam semesta, dimulai saat Malaikat Israfil meniup sangkakala untuk pertama kali."],
["Kehidupan setelah hari kiamat","Urutan: alam barzakh, <i>yaumul ba’ats</i> (kebangkitan), <i>yaumul mahsyar</i> (dikumpulkan), <i>yaumul hisab</i> (perhitungan amal), <i>yaumul mizan</i> (penimbangan amal), melewati <i>shirath</i>, lalu surga atau neraka."],
["Hikmah beriman kepada hari akhir","Mendorong rajin beramal saleh, berhati-hati dalam bertindak (mawas diri), sabar menghadapi ujian, tidak sombong, dan menjauhi perbuatan dosa karena setiap amal akan dimintai pertanggungjawaban. QS Az-Zalzalah/99:7–8: kebaikan atau keburukan sekecil zarrah pun akan mendapat balasan."]

{n:"Zakat, Infak, Sedekah",t:"dan Wakaf",ic:"💰",c:"#d9a406",
sub:[
["Pengertian ZIS","<b>Zakat</b>: mengeluarkan sebagian harta tertentu yang telah memenuhi syarat untuk diberikan kepada yang berhak. <b>Infak</b>: mengeluarkan harta untuk kebaikan, tanpa batas jumlah dan waktu. <b>Sedekah</b>: pemberian sukarela yang cakupannya lebih luas, termasuk yang non-materi seperti senyum dan tenaga."],
["Ketentuan zakat","Zakat adalah rukun Islam ketiga. <b>Zakat fitrah</b>: wajib bagi setiap muslim yang mampu, dibayar pada bulan Ramadan sampai sebelum salat Idulfitri, sebesar sekitar 2,5 kg atau 3,5 liter makanan pokok. <b>Zakat mal</b>: harta mencapai nisab dan haul (satu tahun), kadar 2,5% untuk emas, perak, dan uang (nisab emas 85 gram). Penerima (8 asnaf, QS At-Taubah/9:60): fakir, miskin, amil, muallaf, riqab, gharim, fisabilillah, ibnu sabil."],
["Infak dan sedekah","Infak dan sedekah boleh diberikan kepada siapa saja yang membutuhkan dan kapan saja. Hadis: senyum di depan saudaramu adalah sedekah (HR. Tirmidzi). Sedekah sebaiknya ikhlas dan tidak menyakiti perasaan penerima."],
["Wakaf","Wakaf adalah menahan harta pokok dan menyalurkan manfaatnya untuk kepentingan umum selama-lamanya, misalnya tanah untuk masjid, madrasah, atau sumur. Unsur wakaf: <i>wakif</i> (pemberi wakaf), <i>nazir</i> (pengelola), <i>mauquf</i> (harta wakaf)."],
["Hikmah dan manfaat ZISWAF","Membersihkan harta dan jiwa, menumbuhkan kepedulian dan kasih sayang, mengurangi kesenjangan sosial, menghindarkan sifat kikir, serta mendatangkan keberkahan dan pahala yang terus mengalir."]

["Optimis","Yakin akan pertolongan Allah dan tidak mudah putus asa. “Janganlah kamu berputus asa dari rahmat Allah” (QS Az-Zumar/39:53). Putus asa dari rahmat Allah adalah sifat orang yang tidak beriman (QS Yusuf/12:87)."],
["Ikhtiar","Usaha sungguh-sungguh untuk mencapai tujuan. “Sesungguhnya Allah tidak akan mengubah keadaan suatu kaum sampai mereka mengubah keadaan diri mereka sendiri.” (QS Ar-Ra’d/13:11)."],
["Tawakal","Berserah diri kepada Allah setelah berusaha dan berdoa. “Apabila engkau telah membulatkan tekad, bertawakallah kepada Allah.” (QS Ali ‘Imran/3:159). Nabi saw.: ikatlah untamu, lalu bertawakallah (HR. Tirmidzi)."],
["Hubungan usaha manusia dengan ketentuan Allah","Manusia diperintahkan berusaha, sedangkan hasil akhir adalah ketetapan Allah. Usaha bukan untuk melawan takdir, melainkan bagian dari ikhtiar. Urutannya: berusaha, berdoa, tawakal, lalu menerima hasil dengan ikhlas."],
["Penerapannya dalam kehidupan sehari-hari","Belajar teratur dan berdoa sebelum ujian, tidak menyontek, introspeksi saat gagal, tidak sombong saat berhasil, dan tidak menyalahkan orang lain atau takdir."]
],
q:[
pg("Berserah diri kepada Allah setelah berusaha secara maksimal disebut...",["tawakal","ikhtiar","qana’ah","tamak"],"Tawakal dilakukan setelah ikhtiar dan doa."),
pg("Usaha sungguh-sungguh untuk mencapai suatu tujuan disebut...",["ikhtiar","tawakal","ghibah","riya’"],"Ikhtiar adalah usaha lahiriah yang dilakukan manusia."),

pg("Urutan sikap yang benar dalam meraih keberhasilan adalah...",["ikhtiar, doa, tawakal","tawakal, ikhtiar, doa","doa, tawakal, tanpa ikhtiar","menunggu, berharap, menyerah"],"Berusaha terlebih dahulu, berdoa, lalu berserah diri kepada Allah."),
pg("Sikap optimis ditandai dengan...",["yakin berhasil dan tidak mudah putus asa","mudah menyerah saat gagal","menyalahkan orang lain","menunda pekerjaan"],"Optimis berarti yakin pada pertolongan Allah dan terus berusaha."),
pg("Pesan hadis “ikatlah untamu lalu bertawakallah” adalah...",["berusaha terlebih dahulu, kemudian bertawakal","cukup berdoa tanpa berusaha","tidak perlu menjaga barang","tawakal tidak diperlukan"],"Nabi saw. mengajarkan bahwa tawakal harus didahului ikhtiar."),
pg("Tim sepak bolamu kalah dalam lomba. Sikap yang tepat adalah...",["introspeksi, berlatih lebih giat, dan menerima hasil","menyalahkan wasit dan teman","berhenti bermain selamanya","mengatakan Allah tidak adil"],"Kegagalan adalah kesempatan memperbaiki diri."),
pg("Berserah diri tanpa melakukan usaha apa pun merupakan sikap...",["pasrah yang tidak dibenarkan Islam","tawakal yang benar","ikhtiar yang sempurna","optimis yang terpuji"],"Tawakal yang benar harus disertai ikhtiar."),
pk("Pilih semua contoh ikhtiar dalam menghadapi ujian.",["Belajar secara teratur","Bertanya kepada guru","Berlatih mengerjakan soal","Mencontek saat ujian","Hanya berdoa tanpa belajar"],[0,1,2],"Ikhtiar harus dilakukan dengan cara yang halal dan sungguh-sungguh."),

{n:"Mengembangkan Ekonomi Islam",t:"Muamalah, Jual Beli, dan Riba",ic:"🛒",c:"#e64980",
sub:[
["Muamalah","Muamalah adalah aturan Islam tentang hubungan antarmanusia dalam urusan duniawi, termasuk ekonomi. Hukum asal muamalah adalah boleh, kecuali ada dalil yang melarang."],
["Jual beli","“Allah menghalalkan jual beli dan mengharamkan riba.” (QS Al-Baqarah/2:275). Rukun: penjual, pembeli, ijab kabul, barang, dan nilai tukar. Syarat: suka sama suka (QS An-Nisa’/4:29), barang halal dan bermanfaat, jelas, milik sendiri, dan dapat diserahkan. Terlarang: menjual barang haram, menipu, mengurangi timbangan, menimbun (<i>ihtikar</i>), dan <i>gharar</i> (tidak jelas)."],
["Riba","Riba adalah tambahan yang disyaratkan atas pokok pinjaman atau pertukaran barang sejenis secara tidak sama. Contoh: pinjam Rp100.000 wajib kembali Rp120.000. Riba haram karena merugikan pihak yang lemah dan menimbulkan ketidakadilan."],
["Asuransi dan sistem ekonomi Islam","Asuransi syariah (<i>takaful</i>) berdasar tolong-menolong (<i>ta’awun</i>) lewat dana kebajikan (<i>tabarru’</i>). Lembaga keuangan syariah seperti bank syariah memakai akad bagi hasil, bukan bunga."],
["Prinsip ekonomi yang sesuai syariat","Halal dan thayyib, adil, jujur, amanah, saling rida, tolong-menolong, serta bebas dari riba, gharar, dan maysir (judi)."]
],
q:[
pg("Muamalah adalah aturan Islam tentang...",["hubungan antarmanusia dalam urusan duniawi seperti ekonomi","tata cara salat","tata cara haji","hubungan manusia dengan malaikat"],"Muamalah mengatur interaksi sosial dan ekonomi."),
pg("Ayat yang menghalalkan jual beli dan mengharamkan riba adalah...",["QS Al-Baqarah/2:275","QS Al-Fatihah/1:1","QS Al-Ikhlas/112:1","QS An-Nas/114:1"],"Dasar utama halalnya jual beli dan haramnya riba."),
pg("Salah satu syarat sah jual beli adalah...",["suka sama suka","harga harus selalu murah","pembeli harus orang kaya","dilakukan secara rahasia"],"QS An-Nisa’/4:29 mensyaratkan perdagangan atas dasar suka sama suka."),
pg("Riba adalah...",["tambahan yang disyaratkan atas pokok pinjaman","keuntungan dari berdagang jujur","bagi hasil usaha","sedekah kepada fakir"],"Tambahan yang diwajibkan atas pokok pinjaman termasuk riba."),
pg("Menimbun barang kebutuhan pokok agar harganya naik hukumnya...",["haram","sunah","mubah","wajib"],"Ihtikar merugikan masyarakat sehingga dilarang."),
pg("Berikut yang termasuk jual beli terlarang adalah...",["menjual minuman keras","menjual buku pelajaran","menjual makanan halal","menjual seragam sekolah"],"Barang yang haram tidak boleh diperjualbelikan."),
pg("Prinsip dasar asuransi syariah adalah...",["tolong-menolong (ta’awun)","mencari untung sebesar-besarnya","spekulasi seperti judi","bunga tetap"],"Asuransi syariah berprinsip saling menanggung risiko."),
pg("Ucapan serah terima antara penjual dan pembeli dalam jual beli disebut...",["ijab kabul","wakaf","hibah","haul"],"Ijab adalah penawaran, kabul adalah penerimaan."),
pk("Pilih semua syarat barang yang boleh diperjualbelikan.",["Halal","Bermanfaat","Dapat diserahkan kepada pembeli","Barang hasil curian","Wujud dan kualitasnya tidak jelas"],[0,1,2],"Barang curian dan yang tidak jelas (gharar) tidak sah dijual."),
pk("Pilih semua contoh riba.",["Meminjam Rp100.000 dan wajib mengembalikan Rp120.000","Utang yang bertambah besar karena terlambat membayar","Rentenir yang menetapkan bunga tiap bulan","Bagi hasil usaha sesuai kesepakatan","Jual beli tunai suka sama suka"],[0,1,2],"Bagi hasil dan jual beli tunai bukan riba."),
pk("Pilih semua prinsip ekonomi Islam.",["Keadilan","Kejujuran","Tolong-menolong","Mencari untung dengan segala cara","Spekulasi (maysir)"],[0,1,2],"Ekonomi Islam melarang kecurangan dan spekulasi."),
pk("Pilih semua perilaku pedagang yang jujur.",["Menyebutkan kondisi barang apa adanya","Menggunakan takaran yang tepat","Tidak menipu pembeli","Mengurangi timbangan","Menyembunyikan cacat barang"],[0,1,2],"Kejujuran adalah pilar perdagangan dalam Islam."),
sa("Jual beli harus dilakukan atas dasar suka sama suka.","QS An-Nisa’/4:29 melarang memakan harta dengan cara batil, kecuali perdagangan atas dasar suka sama suka.",0,"Ayat tersebut menjadi dasar syarat suka sama suka."),
sa("Riba hukumnya halal asalkan kedua pihak setuju.","Allah mengharamkan riba (QS Al-Baqarah/2:275).",3,"Pernyataan salah, alasan benar. Riba tetap haram walaupun disetujui kedua pihak."),
sa("Bank syariah menggunakan sistem bagi hasil.","Bank syariah menerapkan bunga tetap pada setiap pinjaman.",2,"Pernyataan benar, alasan salah. Bank syariah tidak memakai bunga."),
sa("Menimbun barang kebutuhan pokok dilarang dalam Islam.","Jual beli dilakukan melalui ijab kabul.",1,"Keduanya benar, tetapi tidak berhubungan sebab akibat.")

{n:"Meneladani Perjuangan Dakwah",t:"Rasulullah Saw.",ic:"🕌",c:"#0c8599",
sub:[
["Strategi dakwah Rasulullah","“Serulah (manusia) ke jalan Tuhanmu dengan hikmah dan pelajaran yang baik, dan berdebatlah dengan mereka dengan cara yang baik.” (QS An-Nahl/16:125). Dakwah dilakukan dengan keteladanan, kesabaran, musyawarah, dan tanpa paksaan."],
["Periode Mekah","Sekitar 13 tahun. Tahap sembunyi-sembunyi (±3 tahun; pengikut awal: Khadijah, Abu Bakar, Ali, Zaid), lalu terang-terangan setelah turun QS Al-Hijr/15:94, menghadapi gangguan kaum Quraisy, hijrah sebagian sahabat ke Habasyah, Tahun Duka cita, dan Isra Mi’raj."],
["Periode Madinah","Sekitar 10 tahun, dimulai dengan hijrah tahun 622 M. Langkah awal: membangun Masjid Quba dan Masjid Nabawi, mempersaudarakan Muhajirin dan Anshar, serta membuat Piagam Madinah. Puncaknya Fathu Makkah (8 H) ketika Rasulullah memaafkan penduduk Mekah."],
["Piagam Madinah","Konstitusi tertulis yang mengatur kehidupan bersama kaum muslim, Yahudi, dan suku lain di Madinah. Isinya: kebebasan beragama, persamaan hak dan keadilan, kewajiban bersama membela Madinah, serta penyelesaian masalah secara damai."],
["Keteladanan Rasulullah dalam berdakwah","Sabar menghadapi gangguan, santun, jujur, memaafkan, bermusyawarah, memuliakan persaudaraan, dan menjadi teladan lebih dahulu sebelum mengajak."]
],
q:[

pg("Perempuan pertama yang beriman kepada Rasulullah saw. adalah...",["Khadijah binti Khuwailid","Aisyah binti Abu Bakar","Fatimah az-Zahra","Hafshah binti Umar"],"Khadijah adalah orang pertama yang beriman dan mendukung dakwah beliau."),
pg("Strategi dakwah menurut QS An-Nahl/16:125 adalah...",["hikmah, nasihat yang baik, dan debat dengan cara yang baik","kekerasan dan paksaan","mengabaikan perbedaan","hanya menggunakan kekuasaan"],"Dakwah dilakukan dengan cara bijak dan santun."),
pg("Hijrah Rasulullah saw. dari Mekah ke Madinah terjadi pada tahun...",["622 M","610 M","630 M","570 M"],"610 M wahyu pertama, 622 M hijrah, 630 M (8 H) Fathu Makkah."),
pg("Piagam Madinah adalah...",["perjanjian yang mengatur kehidupan bersama berbagai kelompok di Madinah","perjanjian damai dengan Kerajaan Romawi","kitab yang berisi wahyu","daftar nama pasukan perang"],"Piagam Madinah adalah konstitusi tertulis pertama di Madinah."),
pg("Masjid pertama yang dibangun Rasulullah saw. saat hijrah adalah...",["Masjid Quba","Masjid Al-Aqsha","Masjid Cordoba","Masjid Demak"],"Masjid Quba dibangun dalam perjalanan hijrah menuju Madinah."),
pg("Persaudaraan antara kaum Muhajirin dan Anshar menunjukkan nilai...",["ukhuwah (persaudaraan) dan tolong-menolong","persaingan dagang","permusuhan antarsuku","pemisahan kelompok"],"Muhajirin (pendatang dari Mekah) dan Anshar (penduduk Madinah) dipersaudarakan."),

pk("Pilih semua isi pokok Piagam Madinah.",["Kebebasan beragama","Kewajiban bersama membela Madinah","Persamaan hak dan keadilan bagi warga","Non-muslim harus diusir dari Madinah","Hanya muslim yang memiliki hak"],[0,1,2],"Piagam Madinah menjamin hak semua warga."),
pk("Pilih semua langkah Rasulullah saw. setelah tiba di Madinah.",["Membangun masjid","Mempersaudarakan Muhajirin dan Anshar","Membuat Piagam Madinah","Memaksa penduduk memeluk Islam","Menghentikan dakwah"],[0,1,2],"Islam tidak boleh dipaksakan (QS Al-Baqarah/2:256)."),
pk("Pilih semua keteladanan Rasulullah saw. dalam berdakwah.",["Sabar menghadapi gangguan","Santun dan penuh hikmah","Bermusyawarah","Membalas dengan kekerasan","Memaksa orang lain"],[0,1,2],"Beliau berdakwah dengan akhlak mulia."),

["Masuk dan berkembangnya Islam di Indonesia","Islam masuk ke Nusantara secara damai melalui jalur perdagangan, perkawinan, pendidikan (pesantren), kesenian, dan tasawuf. Kerajaan Islam pertama adalah Samudra Pasai (Aceh), kemudian Demak, Mataram Islam, Banten, Cirebon, Gowa-Tallo, dan lainnya."],
["Tradisi Islam Nusantara","Contohnya Sekaten dan Grebeg Maulud, tahlilan, peringatan Maulid Nabi, halal bihalal, tradisi lebaran ketupat, pesantren, dan bedug di masjid."],
["Wali Songo","Sembilan wali penyebar Islam di Jawa: Maulana Malik Ibrahim (Gresik), Sunan Ampel (Surabaya), Sunan Bonang (Tuban), Sunan Drajat (Lamongan), Sunan Giri (Gresik), Sunan Kudus, Sunan Kalijaga, Sunan Muria, dan Sunan Gunung Jati (Cirebon). Sunan Kalijaga memakai wayang, Sunan Kudus dikenal toleran (tidak menyembelih sapi di hadapan umat Hindu), Sunan Giri mendirikan pesantren."],

],

/* ---------- pembuat soal ---------- */
function mk(b,i){
  const d=BAB[b].q[i],r={b,i,id:b+'.'+i,t:d.t,e:d.e,sel:[],done:0};
  if(d.t=='pg'){r.q=d.q;r.opts=sh(d.o.map((x,j)=>({x,ok:j==0})))}
  else if(d.t=='pk'){r.q=d.q;r.opts=sh(d.o.map((x,j)=>({x,ok:d.a.includes(j)})))}
  else{r.p=d.p;r.r=d.r;r.opts=SAO.map((x,j)=>({x,ok:j==d.k}))}
  return r;
}
const pool=(bs,t)=>bs.flatMap(b=>BAB[b].q.map((q,i)=>[b,i,q.t]).filter(x=>t=='mix'||x[2]==t));
function begin(title,items,re){
  if(!items.length)return;
  P={title,qs:items.map(x=>mk(x[0],x[1])),k:0,ok:0,xp:0,done:0,re};
  go('play');
}
function startB(b,t){const it=sh(pool([b],t)).slice(0,t=='mix'?10:99);begin('Bab '+(b+1)+': '+BAB[b].n,it,()=>startB(b,t));P.b=b}
function startU(){
  if(!U.b.length)return;
  const it=sh(pool(U.b,U.t)).slice(0,U.n),b=U.b.slice(),t=U.t,n=U.n;
  begin('Ulangan Campuran',it,()=>{U={b,t,n};startU()});
}
function startW(){
  const it=sh(Object.keys(S.wr).map(k=>k.split('.').map(Number))).slice(0,15);
  begin('Latihan Soal yang Salah',it,startW);
}

const AB='ABCDE';
function vPlay(){
  const q=P.qs[P.k],n=P.qs.length,pr=Math.round((P.k+(q.done?1:0))/n*100);
  let body='';
  if(q.t=='sa')body=`<div class=sa><div class=bx><b class=l>PERNYATAAN</b><br>${q.p}</div><div class=sb2>S E B A B</div><div class=bx><b class=l>ALASAN</b><br>${q.r}</div></div><p class=q style="font-size:1.15rem">Pilih hubungan yang tepat antara pernyataan dan alasan.</p>`;
  else body=`<p class=q>${q.q}</p>`+(q.t=='pk'?'<p class=hint>Boleh lebih dari satu jawaban. Pilih semua yang benar.</p>':'');
  const opts=q.opts.map((o,j)=>{
    const picked=q.t=='pk'?q.sel.includes(j):q.pick==j;let c='opt'+(q.t=='pk'?' pk':''),k=AB[j];
    if(q.done){
      if(q.t=='pk'){if(picked&&o.ok){c+=' ok';k='✓'}else if(picked){c+=' no';k='✗'}else if(o.ok){c+=' ok miss';k='✓'}}
      else if(o.ok){c+=' ok';k='✓'}else if(picked){c+=' no';k='✗'}
    }else if(picked)c+=' sel';
    const ev=q.t=='pk'?`onclick="tog(${j},this)" aria-pressed="${picked}"`:`onclick="ans(${j})"`;
    return`<button class="${c}" ${ev}${q.done?' aria-disabled=true':''}><span class=k aria-hidden=true>${k}</span><span>${o.x}${q.done&&q.t=='pk'&&o.ok&&!picked?' <i>(jawaban benar yang terlewat)</i>':''}</span></button>`}).join('');
  let act='';
  if(!q.done&&q.t=='pk')act=`<button class=btn id=ck onclick="chk()"${q.sel.length?'':' disabled'}>Periksa jawaban</button>`;
  if(q.done){
    const xp=q.good?(q.t=='pg'?10:15):0;
    act=`<div class="fb ${q.good?'ok':'no'}" id=fb role=status><b>${q.good?'Benar! +'+xp+' XP':(q.t=='pk'&&q.sel.length?'Belum tepat.':'Belum tepat.')}</b><br>${q.good?'':'Jawaban yang benar: <b style="font-family:Nunito;font-size:1em">'+ansText(q)+'</b><br>'}<span>Pembahasan: ${q.e}</span></div>
<button class=btn id=nx onclick="next()">${P.k<n-1?'Soal berikutnya →':'Lihat hasil'}</button>`}
  return`<div class="row sp"><button class=link onclick="quit()">← Keluar</button><span class=mu>${esc(P.title)} · Soal ${P.k+1}/${n}</span></div>
<div class=bar role=progressbar aria-valuenow=${pr} aria-valuemin=0 aria-valuemax=100 aria-label="Kemajuan latihan"><i style="width:${pr}%"></i></div>
<section class=sheet><div class=top><span class=tag>${TJ[q.t]}</span><span class=mu>Bab ${q.b+1} · ${BAB[q.b].n}</span></div>${body}${opts}${act}</section>`}
function ansText(q){return q.opts.filter(o=>o.ok).map(o=>o.x).join('; ')}
function quit(){if(!P||P.done||confirm('Keluar dari latihan? Soal yang sudah dijawab tetap tercatat.')){go(P&&P.b!=null&&!P.done?'bab':'home',P&&P.b)}}
function ans(j){const q=P.qs[P.k];if(q.done)return;q.pick=j;fin(q,q.opts[j].ok)}
function tog(j,el){const q=P.qs[P.k];if(q.done)return;const i=q.sel.indexOf(j);i<0?q.sel.push(j):q.sel.splice(i,1);el.classList.toggle('sel',i<0);el.setAttribute('aria-pressed',i<0);$('#ck').disabled=!q.sel.length}
function chk(){const q=P.qs[P.k];if(q.done||!q.sel.length)return;fin(q,q.opts.every((o,j)=>q.sel.includes(j)==o.ok))}
function fin(q,ok){
  q.done=1;q.good=ok;const xp=ok?(q.t=='pg'?10:15):0;
  S.tot++;if(ok)S.ok++;
  const a=S.ac[q.b]||(S.ac[q.b]={}),r=a[q.t]||(a[q.t]=[0,0]);r[1]++;if(ok)r[0]++;
  if(ok)delete S.wr[q.id];else S.wr[q.id]=(S.wr[q.id]||0)+1;
  const d=dk(new Date());if(!S.days.includes(d)){S.days.push(d);S.days=S.days.slice(-120)}
  S.xp+=xp;P.xp+=xp;if(ok)P.ok++;save();render();
  const f=$('#fb');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'});const nx=$('#nx');if(nx)nx.focus({preventScroll:true});
}
function next(){if(P.k<P.qs.length-1){P.k++;render();window.scrollTo(0,0)}else{
  P.done=1;P.sc=Math.round(P.ok/P.qs.length*100);if(P.b!=null)S.best[P.b]=Math.max(S.best[P.b]??-1,P.sc);save();go('res')}}

/* ---------- tampilan: hasil ---------- */
function vRes(){
  const n=P.qs.length,sc=P.sc,st=sc>=90?3:sc>=70?2:sc>=50?1:0,msg=sc>=90?'Masya Allah, luar biasa!':sc>=70?'Bagus! Terus tingkatkan.':sc>=50?'Cukup baik. Baca lagi ringkasan materinya.':'Jangan menyerah! Baca ringkasan materi, lalu coba lagi.';
  const per={};P.qs.forEach(q=>{const r=per[q.t]||(per[q.t]=[0,0]);r[1]++;if(q.good)r[0]++});
  const bad=P.qs.filter(q=>!q.good);
  return`<div class=card style="text-align:center"><div class=mu>${esc(P.title)}</div><div class=score>${sc}</div><div class=stars aria-label="${st} dari 3 bintang">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><h2 style="margin:0">${msg}</h2>
<div class=stat><div><b>${P.ok}/${n}</b>benar</div><div><b>+${P.xp}</b>XP</div>${Object.entries(per).map(([t,r])=>`<div><b>${r[0]}/${r[1]}</b>${TJ[t]}</div>`).join('')}</div>
<div class="row" style="justify-content:center"><button class=btn onclick="P.re()">🔁 Ulangi</button><button class="btn s" onclick="go('home')">Beranda</button>${bad.length?`<button class="btn s" onclick="go('wr')">Catatan salah</button>`:''}</div></div>
${bad.length?`<h2>Yang perlu dipelajari lagi</h2>`+bad.map(q=>wrCard(q.b,q.i)).join(''):'<div class=fb style="background:var(--okbg);border:2px solid var(--ok)">Semua jawabanmu benar. Hebat!</div>'}`}
function qText(d){return d.t=='sa'?d.p+' <i>(sebab)</i> '+d.r:d.q}
function wrCard(b,i,cnt){
  const d=BAB[b].q[i],c=d.t=='pg'?d.o[0]:d.t=='pk'?d.a.map(j=>d.o[j]).join('; '):SAO[d.k];
  return`<div class=card><div class=row><span class=tag>${TJ[d.t]}</span><span class=mu>Bab ${b+1}${cnt?' · salah '+cnt+'×':''}</span></div><p style="margin:8px 0">${qText(d)}</p><div class="fb ok" style="margin:6px 0"><b style="font-size:1.05rem">Jawaban:</b> ${c}</div><div class=mu>${d.e}</div></div>`}

function vUlg(){

  const pill=(on,k,l,fn)=>`<button class="pill${on?' on':''}" data-k="${k}" aria-pressed="${on}" onclick="${fn}">${l}</button>`;
  return`<h1>📝 Ulangan Campuran</h1><p class=mu>Pilih bab, jenis soal, dan jumlah soal.</p>
<div class=card><h3>Bab</h3><div style="margin-top:8px"><button class=link onclick="ub('all')">Pilih semua</button> · <button class=link onclick="ub('none')">Kosongkan</button></div>
${BAB.map((x,b)=>pill(U.b.includes(b),'b'+b,'Bab '+(b+1)+' '+x.ic,`ub(${b})`)).join('')}</div>
<div class=card><h3>Jenis soal</h3><div style="margin-top:8px">${[['mix','Semua jenis'],['pg','Pilihan Ganda'],['pk','PG Kompleks'],['sa','Sebab-Akibat']].map(([t,l])=>pill(U.t==t,'t'+t,l,`ut('${t}')`)).join('')}</div>
<h3 style="margin-top:10px">Jumlah soal</h3><div style="margin-top:8px">${[10,20,30].map(k=>pill(U.n==k,'n'+k,k+' soal',`un(${k})`)).join('')}</div></div>
<button class=btn onclick="startU()"${total?'':' disabled'}>Mulai ulangan (${n} soal)</button>${total?'':'<p class=mu role=alert>Pilih minimal satu bab.</p>'}`}
function ub(b){if(b=='all')U.b=BAB.map((_,i)=>i);else if(b=='none')U.b=[];else{const i=U.b.indexOf(b);i<0?U.b.push(b):U.b.splice(i,1)}FC=typeof b=='number'?'b'+b:null;render()}
function ut(t){U.t=t;FC='t'+t;render()}
function un(n){U.n=n;FC='n'+n;render()}
function vWr(){
  const ids=Object.keys(S.wr);
  if(!ids.length)return`<h1>📒 Catatan Soal Salah</h1><div class=card><p>Belum ada soal yang salah. Kerjakan latihan, nanti soal yang salah muncul di sini sampai kamu menjawabnya dengan benar.</p><button class=btn onclick="go('home')">Mulai latihan</button></div>`;
  return`<h1>📒 Catatan Soal Salah</h1><p class=mu>${ids.length} soal. Soal hilang dari catatan jika kamu menjawabnya benar.</p>
<button class=btn onclick="startW()">Latih soal-soal ini (maks. 15)</button><div style="height:14px"></div>
${ids.map(k=>{const[b,i]=k.split('.').map(Number);return wrCard(b,i,S.wr[k])}).join('')}`}

/* ---------- mulai ---------- */
load();
let t0;try{t0=localStorage.getItem(TKEY)}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
V=S.name?'home':'intro';
render();
</script>
</body></html>
